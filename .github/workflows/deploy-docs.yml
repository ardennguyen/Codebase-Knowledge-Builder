name: Incremental Generate and Deploy API Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install Dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Cache Documentation and Manifest
        uses: actions/cache@v4
        with:
          path: |
            output/Codebase-Knowledge-Builder/.doc_cache_manifest.json
            output/Codebase-Knowledge-Builder/docs/api/
          key: doc-cache-${{ hashFiles('**/*.py') }}
          restore-keys: |
            doc-cache-

      - name: Generate API Specs via Codebase KB
        env:
          PYTHONUNBUFFERED: "1"
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py --dir . --name Codebase-Knowledge-Builder --mode api-reference --mkdocs --incremental

      - name: Setup base mkdocs.yml and copy original docs
        run: |
          # Copy all static markdown docs into the generated output directory
          cp -R docs/* output/Codebase-Knowledge-Builder/docs/
          
          # Remove pocketflow framework docs as per user request to keep the site strictly focused on the project itself
          rm -rf output/Codebase-Knowledge-Builder/docs/pocketflow
          
          # Create the base mkdocs config with a root nav structure
          cat << 'EOF' > output/Codebase-Knowledge-Builder/mkdocs.yml
          site_name: Codebase Knowledge Builder API Reference
          theme:
            name: material
            features:
              - content.code.copy
          markdown_extensions:
            - pymdownx.highlight:
                anchor_linenums: true
                use_pygments: true
            - pymdownx.superfences
            - pymdownx.inlinehilite
          nav:
            - Home: index.md
            - Architecture & Design: design.md
          EOF

      - name: Merge Navigation Configuration
        run: |
          # The generated nav_snippet.yml has "nav:" on the first line. 
          # We strip it and append the rest to our base config so it merges flawlessly.
          sed '1d' output/Codebase-Knowledge-Builder/docs/nav_snippet.yml >> output/Codebase-Knowledge-Builder/mkdocs.yml

      - name: Deploy to GitHub Pages
        working-directory: output/Codebase-Knowledge-Builder
        run: mkdocs gh-deploy --force
