name: Incremental Generate and Deploy API Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all chapters (clear cache)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

# When does this spend LLM credit? Repository variable DOCS_DEPLOY_MODE
# (Settings -> Secrets and variables -> Actions -> Variables):
#   auto    a push to main waits for approval in the "docs-deploy" environment, then deploys
#   manual  (also when unset) pushes do nothing; only "Run workflow" (workflow_dispatch) deploys
#   off     nothing runs, not even "Run workflow"
# Before setting auto, give the "docs-deploy" environment a required reviewer
# (Settings -> Environments). GitHub creates a referenced environment without protection
# rules, so without a reviewer, push runs would deploy immediately.

jobs:
  approve:
    # Push runs park here until approved (or rejected); waiting is not billed and times out after 30 days.
    if: github.event_name == 'push' && vars.DOCS_DEPLOY_MODE == 'auto'
    runs-on: ubuntu-latest
    environment: docs-deploy
    # Only the newest push waits for approval: a newer push cancels an older approval that is still waiting.
    concurrency:
      group: docs-approval
      cancel-in-progress: true
    steps:
      - run: echo "Docs deploy approved for ${{ github.sha }}"

  build-and-deploy:
    needs: approve
    # Push: only once approved. Run workflow: directly, unless DOCS_DEPLOY_MODE is off.
    # !cancelled() lets the job run when approve was skipped (dispatch) instead of skipping with it.
    if: >-
      ${{ !cancelled() && (needs.approve.result == 'success'
      || (github.event_name == 'workflow_dispatch' && vars.DOCS_DEPLOY_MODE != 'off')) }}
    runs-on: ubuntu-latest
    # Newest wins: once a newer run's deploy starts (push approved, or "Run workflow"), it cancels the one
    # in progress, so an older commit never overwrites the site and there is no `gh-deploy --force` race.
    # Job-level on purpose: a push whose deploy is skipped (manual/off, rejected) never cancels anything.
    # Cost: a cancelled run loses what it generated so far (pages and cache are saved only after
    # generation), so the new run pays for those chapters again.
    concurrency:
      group: deploy-docs
      cancel-in-progress: true
    # Generous cap (~5x the longest incremental run) so a stalled LLM stream cannot hold the job for 6 h
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # Rolling cache: restore the newest manifest + pages, save the updated ones under a new key.
      # Invalidation is per chapter in the code (md5 of generation signature + source), so prompt,
      # model, thinking or source changes need no cache-key or force-rebuild logic here.
      - name: Restore Documentation and Manifest
        uses: actions/cache/restore@v6
        with:
          path: |
            output/Codebase-Knowledge-Builder/.doc_cache_manifest.json
            output/Codebase-Knowledge-Builder/docs/api/
          key: doc-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            doc-cache-

      # Rolling cache: restore the newest token-ratio calibration, save the updated one under a new key,
      # so each run starts with the ratio learned from the previous runs' billed usage.
      - name: Cache token-ratio calibration
        uses: actions/cache@v6
        with:
          path: llm_token_calibration.json
          key: token-calibration-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            token-calibration-

      - name: Generate API Specs via Codebase KB
        env:
          PYTHONUNBUFFERED: "1"
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FORCE_FLAG=""
          if [[ "${{ inputs.force_rebuild }}" == "true" ]]; then
            FORCE_FLAG="--force-rebuild"
            echo "🔄 Force rebuild: manual trigger"
          fi
          python main.py --dir . --name Codebase-Knowledge-Builder --mode api-reference --mkdocs --incremental --no-cache --thinking-profile quality --debug $FORCE_FLAG

      # Saved right after generation, so a failure in the deploy steps below keeps the paid-for pages
      - name: Save Documentation and Manifest
        uses: actions/cache/save@v6
        with:
          path: |
            output/Codebase-Knowledge-Builder/.doc_cache_manifest.json
            output/Codebase-Knowledge-Builder/docs/api/
          key: doc-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup base mkdocs.yml and copy original docs
        run: |
          # Copy static markdown docs into generated output
          cp -R docs/* output/Codebase-Knowledge-Builder/docs/
          
          # Remove pocketflow framework docs as per user request
          rm -rf output/Codebase-Knowledge-Builder/docs/pocketflow
          
          # Create base mkdocs.yml and mermaid-init.js
          # Uses a committed script to avoid shell escaping issues with
          # !!python/name: YAML tags in mkdocs config
          python3 .github/ci_mkdocs_config.py

      - name: Merge Navigation Configuration
        run: |
          # The generated nav_snippet.yml has "nav:" on the first line. 
          # We strip it and append the rest to our base config so it merges flawlessly.
          sed '1d' output/Codebase-Knowledge-Builder/nav_snippet.yml >> output/Codebase-Knowledge-Builder/mkdocs.yml

      - name: Deploy to GitHub Pages
        working-directory: output/Codebase-Knowledge-Builder
        run: mkdocs gh-deploy --force
