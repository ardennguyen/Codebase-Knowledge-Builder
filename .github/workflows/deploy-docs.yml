name: Incremental Generate and Deploy API Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all chapters (clear cache)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install mkdocs-panzoom-plugin

      - name: Detect prompt changes
        id: prompts
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          if git diff "$BEFORE" HEAD --name-only 2>/dev/null | grep -q 'prompts/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 Prompt templates changed — will force rebuild"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Cache Documentation and Manifest
        uses: actions/cache@v6
        with:
          path: |
            output/Codebase-Knowledge-Builder/.doc_cache_manifest.json
            output/Codebase-Knowledge-Builder/docs/api/
          key: doc-cache-${{ hashFiles('nodes.py', 'flow.py', 'main.py', 'utils/*.py', 'pocketflow.py', 'prompts/**') }}
          restore-keys: |
            doc-cache-

      - name: Generate API Specs via Codebase KB
        env:
          PYTHONUNBUFFERED: "1"
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FORCE_FLAG=""
          if [[ "${{ inputs.force_rebuild }}" == "true" ]] || [[ "${{ steps.prompts.outputs.changed }}" == "true" ]]; then
            FORCE_FLAG="--force-rebuild"
            echo "🔄 Force rebuild: prompt templates changed or manual trigger"
          fi
          python main.py --dir . --name Codebase-Knowledge-Builder --mode api-reference --mkdocs --incremental $FORCE_FLAG

      - name: Setup base mkdocs.yml and copy original docs
        run: |
          # Copy static markdown docs into generated output
          cp -R docs/* output/Codebase-Knowledge-Builder/docs/
          
          # Remove pocketflow framework docs as per user request
          rm -rf output/Codebase-Knowledge-Builder/docs/pocketflow
          
          # Create the base mkdocs config with a root nav structure
          python3 -c "
          import textwrap, pathlib
          pathlib.Path('output/Codebase-Knowledge-Builder/mkdocs.yml').write_text(textwrap.dedent('''
          site_name: Codebase Knowledge Builder API Reference
          site_url: https://ardennguyen.github.io/Codebase-Knowledge-Builder/
          theme:
            name: material
            features:
              - content.code.copy
              - navigation.indexes
            palette:
              - scheme: default
                toggle:
                  icon: material/brightness-7
                  name: Switch to dark mode
              - scheme: slate
                toggle:
                  icon: material/brightness-4
                  name: Switch to light mode
          plugins:
            - search
            - panzoom:
                include_selectors:
                  - .mermaid
          markdown_extensions:
            - pymdownx.highlight:
                anchor_linenums: true
                use_pygments: true
            - pymdownx.superfences:
                custom_fences:
                  - name: mermaid
                    class: mermaid
                    format: !!python/name:pymdownx.superfences.fence_code_format
            - pymdownx.inlinehilite
          extra_css:
            - stylesheets/mermaid-vibrant.css
          nav:
            - Home: index.md
            - Architecture & Design: design.md
          ''').lstrip())
          "

          # Create vibrant Mermaid theme CSS (Material overrides %%{init}%%)
          mkdir -p output/Codebase-Knowledge-Builder/docs/stylesheets
          python3 -c "
          import textwrap, pathlib
          pathlib.Path('output/Codebase-Knowledge-Builder/docs/stylesheets/mermaid-vibrant.css').write_text(textwrap.dedent('''
          /* Vibrant Mermaid diagram theme — overrides Material muted colors */
          .mermaid .cluster rect {
            fill: #ffffde !important;
            stroke: #aaaa33 !important;
            stroke-width: 1px !important;
          }
          .mermaid .cluster text {
            fill: #333 !important;
          }
          .mermaid .node rect,
          .mermaid .node polygon,
          .mermaid .node circle {
            fill: #ECECFF !important;
            stroke: #9370DB !important;
            stroke-width: 1px !important;
          }
          .mermaid .nodeLabel {
            color: #333 !important;
          }
          .mermaid .edgeLabel {
            background-color: #e8e8e8 !important;
            color: #333 !important;
          }
          .mermaid .edge-pattern-solid {
            stroke: #333 !important;
          }
          ''').lstrip())
          "

      - name: Merge Navigation Configuration
        run: |
          # The generated nav_snippet.yml has "nav:" on the first line. 
          # We strip it and append the rest to our base config so it merges flawlessly.
          sed '1d' output/Codebase-Knowledge-Builder/docs/nav_snippet.yml >> output/Codebase-Knowledge-Builder/mkdocs.yml

      - name: Deploy to GitHub Pages
        working-directory: output/Codebase-Knowledge-Builder
        run: mkdocs gh-deploy --force
