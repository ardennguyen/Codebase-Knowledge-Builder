name: Incremental Generate and Deploy API Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all chapters (clear cache)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install mkdocs-panzoom-plugin

      - name: Detect prompt changes
        id: prompts
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          if git diff "$BEFORE" HEAD --name-only 2>/dev/null | grep -q 'prompts/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 Prompt templates changed — will force rebuild"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Cache Documentation and Manifest
        uses: actions/cache@v6
        with:
          path: |
            output/Codebase-Knowledge-Builder/.doc_cache_manifest.json
            output/Codebase-Knowledge-Builder/docs/api/
          key: doc-cache-${{ hashFiles('nodes.py', 'flow.py', 'main.py', 'utils/*.py', 'pocketflow.py', 'prompts/**') }}
          restore-keys: |
            doc-cache-

      - name: Generate API Specs via Codebase KB
        env:
          PYTHONUNBUFFERED: "1"
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FORCE_FLAG=""
          if [[ "${{ inputs.force_rebuild }}" == "true" ]] || [[ "${{ steps.prompts.outputs.changed }}" == "true" ]]; then
            FORCE_FLAG="--force-rebuild"
            echo "🔄 Force rebuild: prompt templates changed or manual trigger"
          fi
          python main.py --dir . --name Codebase-Knowledge-Builder --mode api-reference --mkdocs --incremental $FORCE_FLAG

      - name: Setup base mkdocs.yml and copy original docs
        run: |
          # Copy static markdown docs into generated output
          cp -R docs/* output/Codebase-Knowledge-Builder/docs/
          
          # Remove pocketflow framework docs as per user request
          rm -rf output/Codebase-Knowledge-Builder/docs/pocketflow
          
          # Create base mkdocs.yml and vibrant Mermaid CSS
          # Uses a committed script to avoid shell escaping issues with
          # !!python/name: YAML tags and !important CSS values
          python3 .github/ci_mkdocs_config.py

      - name: Merge Navigation Configuration
        run: |
          # The generated nav_snippet.yml has "nav:" on the first line. 
          # We strip it and append the rest to our base config so it merges flawlessly.
          sed '1d' output/Codebase-Knowledge-Builder/docs/nav_snippet.yml >> output/Codebase-Knowledge-Builder/mkdocs.yml

      - name: Deploy to GitHub Pages
        working-directory: output/Codebase-Knowledge-Builder
        run: mkdocs gh-deploy --force
