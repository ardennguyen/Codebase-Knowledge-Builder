repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.4
    hooks:
      # Run the linter with auto-fix.
      - id: ruff-check
        args: [--fix, --verbose]
        verbose: true
      # Run the formatter.
      - id: ruff-format
        args: [--verbose]
        verbose: true
