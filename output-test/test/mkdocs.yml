site_name: 'test — API Reference'
theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
  - panzoom:
      include_selectors:
        - '.mermaid-raw'
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-raw
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js
nav:
  - Home: index.md
  - API Reference:
    - api/index.md
    - '__init__.py': 'api/utils/__init__.py.md'
    - 'call_llm.py': 'api/utils/call_llm.py.md'
    - 'crawl_github_files.py': 'api/utils/crawl_github_files.py.md'
    - 'crawl_local_files.py': 'api/utils/crawl_local_files.py.md'
    - 'exclude_patterns.py': 'api/utils/exclude_patterns.py.md'
    - 'output.py': 'api/utils/output.py.md'
    - 'prompts.py': 'api/utils/prompts.py.md'
    - 'token_utils.py': 'api/utils/token_utils.py.md'
    - 'flow.py': 'api/flow.py.md'
    - 'main.py': 'api/main.py.md'
    - 'nodes.py': 'api/nodes.py.md'
